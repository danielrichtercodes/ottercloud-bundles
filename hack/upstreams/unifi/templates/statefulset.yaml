apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "chart.fullname" . }}
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.network.multus.enabled }}
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ include "chart.fullname" . }}
      {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: import-cert
          image: eclipse-temurin:17-jre  # alpine:3.20
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              mkdir -p /config/data
              openssl pkcs12 -export \
                -inkey /certs/tls.key \
                -in /certs/tls.crt \
                -name unifi \
                -passout pass:unifi \
                -out /tmp/unifi.p12
              keytool -importkeystore -noprompt \
                -deststorepass aircontrolenterprise \
                -destkeypass   aircontrolenterprise \
                -destkeystore  /config/data/keystore \
                -srckeystore   /tmp/unifi.p12 \
                -srcstoretype  PKCS12 \
                -srcstorepass  unifi \
                -alias         unifi
              chown -R 1000:1000 /config/data/keystore || true
          volumeMounts:
            - { name: certs,  mountPath: /certs, readOnly: true }
            - { name: config, mountPath: /config }
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: "MONGO_USER"
              value: "{{ .Values.mongodb.user}}"
            - name: "MONGO_PASS"
              value: "{{ .Values.mongodb.password}}"
            - name: "MONGO_DBNAME"
              value: "{{ .Values.mongodb.db}}"
            - name: "MONGO_AUTHSOURCE"
              value: "{{ .Values.mongodb.authsource}}"
            - name: "MONGO_HOST"
              value: "{{ .Values.mongodb.host}}"
            - name: "MONGO_PORT"
              value: "27017"
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /config }
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "chart.fullname" . }}
        - name: certs
          secret:
            secretName: {{ include "chart.fullname" . }}
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
