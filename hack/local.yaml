csiDriver:
  name: "org.democratic-csi.local"
controller:
  externalAttacher:
    enabled: false
  externalResizer:
    enabled: false
  externalSnapshotter:
    enabled: false
driver:
  config:
    driver: local-hostpath
    instance_id:
    local-hostpath:
      shareBasePath: "/var/lib/csi-local-hostpath"
      controllerBasePath: "/var/lib/csi-local-hostpath"
      dirPermissionsMode: "0777"
      dirPermissionsUser: 0
      dirPermissionsGroup: 0