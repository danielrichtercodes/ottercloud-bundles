strategy:
  type: Recreate
controllers:
  main:
    enabled: true
    containers:
      main:
        image:
          repository: ghcr.io/mealie-recipes/mealie
          tag: v2.8.0
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
service:
  main:
    controller: main
    ports:
      http:
        port: 9000
ingress:
  main:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: appetizer.danielrichter.codes
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      main: # the controller with the "main" identifier
        main: # the container with the "main" identifier
          - path: /app/data/
            readOnly: false
postgresql:
  enabled: false
  #  auth:
  #    postgresPassword: ""
  #    username: ""
  #    password: ""
  #    database: ""
  persistence:
    enabled: true
    storageClass:
    accessModes:
      - ReadWriteOnce