
services:
  wg-easy:
    networks: [npm]
    environment:
      - LANG=de
      - WG_HOST=vpn.danielr1996.de
      # Optional:
      - PASSWORD_HASH=$$2a$$12$$Yg5C3PGT08sdmIZT9thlDuY1EGvsoZ4MnYKaK7w513i0xyE5KB.ni
      # - PORT=51821
      # - WG_PORT=51820
      # - WG_CONFIG_PORT=92820
      # - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=192.168.178.10
