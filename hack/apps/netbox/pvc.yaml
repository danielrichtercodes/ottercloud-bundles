extraDeploy:
- apiVersion: v1
  kind: Secret
  metadata:
    name: smb-pgbackup-credentials
  stringData:
    username: "danie"
    password: "Reichenschwand5"
- apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: pgbackup
    annotations:
      pv.kubernetes.io/provisioned-by: smb.csi.k8s.io
  spec:
    capacity:
      storage: 1Gi
    accessModes:
      - ReadWriteOnce
    persistentVolumeReclaimPolicy: Retain
  #  storageClassName: smb
    mountOptions:
      - dir_mode=0777
      - file_mode=0777
      - uid=1001
      - gid=1001
      - noperm
      - mfsymlinks
      - cache=strict
      - noserverino  # required to prevent data corruption
    csi:
      driver: smb.csi.k8s.io
      # volumeHandle format: {smb-server-address}#{sub-dir-name}#{share-name}
      # make sure this value is unique for every share in the cluster
      volumeHandle: truenas.danielr1996.de#pgbackup
      volumeAttributes:
        source: //truenas.danielr1996.de/pgbackup
      nodeStageSecretRef:
        name: smb-pgbackup-credentials
        namespace: netbox
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: pgbackup
  spec:
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
    volumeName: pgbackup
