repositories:
  - name: stakater
    url: https://stakater.github.io/stakater-charts
releases:
  - name: reloader
    namespace: kube-system
    chart: stakater/reloader
    version: 2.2.3
    values:
      - reloader:
          watchGlobally: true        # watch all namespaces
          reloadOnCreate: true       # restart when new secret/configmap created
          ignoreNamespaces: ["kube-system", "kube-public"]
