services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15.1.0
    container_name: wireguard
    restart: unless-stopped
    #environment:
      #- LANG=de
      #- WG_HOST=vpn.danielrichter.codes
      # Optional:
      #- PASSWORD_HASH=$$2a$$12$$Yg5C3PGT08sdmIZT9thlDuY1EGvsoZ4MnYKaK7w513i0xyE5KB.ni #^Gb#LQ*a92ZRgd@WWo@7
      # - WG_DEFAULT_ADDRESS=10.8.0.x
      #- WG_DEFAULT_DNS=192.168.0.1
      # - WG_MTU=1420
      # - WG_ALLOWED_IPS=192.168.15.0/24, 10.0.1.0/24
      # - WG_PERSISTENT_KEEPALIVE=25
      # - WG_PRE_UP=echo "Pre Up" > /etc/wireguard/pre-up.txt
      # - WG_POST_UP=echo "Post Up" > /etc/wireguard/post-up.txt
      # - WG_PRE_DOWN=echo "Pre Down" > /etc/wireguard/pre-down.txt
      # - WG_POST_DOWN=echo "Post Down" > /etc/wireguard/post-down.txt
      #- UI_TRAFFIC_STATS=true
      #- UI_CHART_TYPE=2 # (0 Charts disabled, 1 # Line chart, 2 # Area chart, 3 # Bar chart)
    networks: [ nginx-proxy-manager ]
    ports:
      - "192.168.178.7:51820:51820/udp"
      - "[fd00::7]:51820:51820/udp"
      - "51821"
    volumes:
      - /mnt/chungus/apps/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
networks:
  nginx-proxy-manager:
    external: true