services:
  automated-ripping-machine:
    image: automaticrippingmachine/automatic-ripping-machine:2.21.0
    container_name: automatic-ripping-machine
    restart: unless-stopped
    volumes:
      - /mnt/chungus/apps/automatic-ripping-machine/data:/home/arm
      - /mnt/chungus/apps/automatic-ripping-machine/config:/etc/arm/config
    environment:
      ARM_UID: 3002
      ARM_GID: 3002
      UI_BASE_URL: arm.danielr1996.de
      TZ: Europe/Berlin

    networks: [nginx-proxy-manager]
    ports:
      - "8080"
    devices:
      - "/dev/sr0:/dev/sr0"
      - "/dev/sg5:/dev/sg5"
    cap_add:
      - SYS_ADMIN
  makemkv:
    image: jlesage/makemkv
    container_name: makemkv
    restart: unless-stopped
    environment:
      ARM_UID: 3002
      ARM_GID: 3002
    networks: [nginx-proxy-manager]
    ports:
      - 5800
    volumes:
      - /mnt/chungus/apps/automatic-ripping-machine/makemkv/config:/config
      - /mnt/chungus/apps/automatic-ripping-machine/makemkv/storage:/storage
      - /mnt/chungus/apps/automatic-ripping-machine/makemkv/output:/output
    devices:
      - "/dev/sr0:/dev/sr0"
      - "/dev/sg5:/dev/sg5"
    cap_add:
      - SYS_ADMIN
networks:
  nginx-proxy-manager:
    external: true