apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: restic-exporter
  namespace: restic-exporter
spec:
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "prometheus"
  allowCrossNamespaceImport: true
  folder: Backups
  instanceSelector:
    matchLabels:
      dashboards: grafana
  grafanaCom:
    id: 17554